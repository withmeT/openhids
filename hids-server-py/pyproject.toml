[project]
name = "hids-server"
version = "0.3.0"
description = "HIDS server: event ingest, enrichment, threat rules, ES storage, and encrypted baseline control plane"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
    "zstandard>=0.22",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hids-server = "hids_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hids_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
